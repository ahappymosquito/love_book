# Static CDN vhost for cdn.tingle272.xyz.
# Keep serving the existing host root; do not move files when the public name changes.

server {
    listen 80;
    listen [::]:80;
    server_name cdn.tingle272.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cdn.tingle272.xyz;

    ssl_certificate     /etc/letsencrypt/live/tingle272.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tingle272.xyz/privkey.pem;
    include /etc/nginx/snippets/love-book-ssl.conf;

    root /var/www/cdn.qrqto.club;
    index index.html;
    client_max_body_size 25m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
        add_header Access-Control-Allow-Origin "*";
        add_header X-Content-Type-Options nosniff;
    }

    location ~* \.(php|jsp|asp|aspx|cgi)$ {
        deny all;
    }
}
