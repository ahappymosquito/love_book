# Public HTTPS vhost for Love Book. Certificates live in /etc/nginx/certs and
# are swapped to Let's Encrypt live files after certbot webroot succeeds.

server {
    listen 80;
    listen [::]:80;
    server_name qrqto.club www.qrqto.club;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name qrqto.club;

    ssl_certificate     /etc/nginx/certs/qrqto.club/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/qrqto.club/privkey.pem;
    include /etc/nginx/snippets/love-book-ssl.conf;
    include /etc/nginx/snippets/love-book-proxy.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.qrqto.club;

    ssl_certificate     /etc/nginx/certs/www.qrqto.club/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/www.qrqto.club/privkey.pem;
    include /etc/nginx/snippets/love-book-ssl.conf;
    include /etc/nginx/snippets/love-book-proxy.conf;
}
