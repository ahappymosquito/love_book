# Public HTTPS vhost for Love Book on tingle272.xyz.
# Certificates are the host Let's Encrypt live files. Do not run certbot --nginx.
# Same-host extras such as SAM /app and /vault stay in the server copy of this
# vhost; this repo file only covers Love Book.

server {
    listen 80;
    listen [::]:80;
    server_name tingle272.xyz www.tingle272.xyz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tingle272.xyz;

    ssl_certificate     /etc/letsencrypt/live/tingle272.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tingle272.xyz/privkey.pem;
    include /etc/nginx/snippets/love-book-ssl.conf;
    include /etc/nginx/snippets/love-book-proxy.conf;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.tingle272.xyz;

    ssl_certificate     /etc/letsencrypt/live/tingle272.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tingle272.xyz/privkey.pem;
    include /etc/nginx/snippets/love-book-ssl.conf;
    return 301 https://tingle272.xyz$request_uri;
}
