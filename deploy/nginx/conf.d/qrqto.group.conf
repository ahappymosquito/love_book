# db.example.com 入口配置
#
# 默认仅监听 80，启用 HTTPS：
#   1. 把证书放到 ./deploy/nginx/certs/db.example.com.{crt,key}
#   2. 取消下方 listen 443 ssl 段落注释
#   3. 把第一段 80 server 改为 301 跳转到 https
#
# 域名变更时请同步修改 server_name 与 docker-compose.yml 中 APP_PUBLIC_URL。

server {
    listen 80;
    listen [::]:80;
    server_name db.example.com www.db.example.com;

    # ACME 验证目录（certbot --webroot 默认路径）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # 已签发证书后启用 HTTPS 强跳，把下面这行的 # 去掉即可
    # return 301 https://$host$request_uri;

    include /etc/nginx/conf.d/_app.locations;
}

