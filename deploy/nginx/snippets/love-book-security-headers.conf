# Browser security headers for the tingle272.xyz HTTPS server.
# nginx drops inherited add_header directives in any location that declares its own add_header,
# so include this snippet again inside such locations (e.g. /_next/static/).
# geolocation stays allowed for self: /todo nearby draw and /me common location use browser geolocation.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
