# Reverse-proxy Love Book backend/frontend on loopback. Do not publish these ports on 0.0.0.0.
# Host and X-Forwarded-* must be set in every proxy_pass location so Next.js RSC
# and FastAPI see the public domain instead of 127.0.0.1.
client_max_body_size 25m;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
    try_files $uri =404;
}

location /api/ {
    include /etc/nginx/snippets/love-book-proxy-headers.conf;
    proxy_pass http://127.0.0.1:8000/;
    proxy_redirect off;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /docs {
    include /etc/nginx/snippets/love-book-proxy-headers.conf;
    proxy_pass http://127.0.0.1:8000/docs;
}

location = /openapi.json {
    include /etc/nginx/snippets/love-book-proxy-headers.conf;
    proxy_pass http://127.0.0.1:8000/openapi.json;
}

location /_next/static/ {
    include /etc/nginx/snippets/love-book-proxy-headers.conf;
    proxy_pass http://127.0.0.1:3000;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location / {
    include /etc/nginx/snippets/love-book-proxy-headers.conf;
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_cache_bypass $http_upgrade;
}
