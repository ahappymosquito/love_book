# Locked backend runtime and development dependencies for the Love Book FastAPI service.

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = "0.136.1"
python-multipart = "0.0.29"
python-dotenv = "1.2.2"
sqlalchemy = "2.0.49"
pymysql = "1.2.0"
cryptography = "48.0.0"
uvicorn = { version = "0.47.0", extras = ["standard"] }
pillow = "12.2.0"
httpx = "0.28.1"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.3"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
