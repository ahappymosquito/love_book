# Repair the stable-latest aliases from an existing immutable Love Book release without rebuilding images.
name: promote-existing-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable SemVer to promote, without the v prefix
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/ahappymosquito/love_book-backend
  FRONTEND_IMAGE: ghcr.io/ahappymosquito/love_book-frontend

jobs:
  promote:
    name: promote existing stable release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate release version and GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          [[ "${VERSION}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable source images
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          docker buildx imagetools inspect "${BACKEND_IMAGE}:${VERSION}"
          docker buildx imagetools inspect "${FRONTEND_IMAGE}:${VERSION}"

      - name: Promote matching images to latest
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          docker buildx imagetools create --tag "${BACKEND_IMAGE}:latest" "${BACKEND_IMAGE}:${VERSION}"
          docker buildx imagetools create --tag "${FRONTEND_IMAGE}:latest" "${FRONTEND_IMAGE}:${VERSION}"

      - name: Verify stable-latest aliases
        shell: bash
        run: |
          docker buildx imagetools inspect "${BACKEND_IMAGE}:latest"
          docker buildx imagetools inspect "${FRONTEND_IMAGE}:latest"
