name: ci

# Validate every normal change without publishing images or other release artifacts.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: test · build · version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Verify application version
        run: python scripts/version.py check

      - name: Install locked backend dependencies
        run: poetry sync --no-root --no-interaction

      - name: Test backend
        run: poetry run python -m pytest -q --basetemp=.pytest-tmp/ci

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Build frontend
        working-directory: web
        run: npm run build
