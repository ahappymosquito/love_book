# Build stable-release images, smoke-test both containers, publish immutable X.Y.Z / sha tags,
# then move the convenience latest pointer and publish the GitHub Release.
# Production pins the immutable X.Y.Z tag (LOVE_BOOK_IMAGE_TAG); latest is never the deploy source of truth.
name: release-images

# Stable semantic-version tags are the only event allowed to publish images.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# Only jobs that push to GHCR or edit the Release get write scopes.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Match tag to the canonical version
        run: python scripts/version.py check --tag "$GITHUB_REF_NAME"

      - name: Install and test locked backend
        run: |
          poetry sync --no-root --no-interaction
          poetry run python -m pytest -q --basetemp=.pytest-tmp-release

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build locked frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  prep:
    name: image metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: verify
    outputs:
      image_owner: ${{ steps.names.outputs.owner }}
      image_repo: ${{ steps.names.outputs.repo }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read canonical version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Normalize image names
        id: names
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          repo="${GITHUB_REPOSITORY##*/}"
          echo "repo=${repo,,}" >> "$GITHUB_OUTPUT"

  smoke:
    name: smoke ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: prep
    strategy:
      fail-fast: true
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: ./Dockerfile
            description: FastAPI backend for Love Book
            build_args: APP_GIT_SHA=${{ github.sha }}
          - component: frontend
            context: ./web
            dockerfile: ./web/Dockerfile
            description: Next.js frontend for Love Book
            build_args: NEXT_PUBLIC_API_BASE=/api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build candidate image without pushing
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          tags: love-book-${{ matrix.component }}:candidate
          labels: |
            org.opencontainers.image.title=love-book-${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      - name: Run container smoke test
        shell: bash
        run: |
          bash scripts/ci_smoke_image.sh \
            "${{ matrix.component }}" \
            "love-book-${{ matrix.component }}:candidate" \
            "${{ needs.prep.outputs.version }}" \
            "${{ github.sha }}"

  publish:
    name: publish ${{ matrix.component }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [prep, smoke]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: .
            dockerfile: ./Dockerfile
            description: FastAPI backend for Love Book
            build_args: APP_GIT_SHA=${{ github.sha }}
          - component: frontend
            context: ./web
            dockerfile: ./web/Dockerfile
            description: Next.js frontend for Love Book
            build_args: NEXT_PUBLIC_API_BASE=/api
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prep.outputs.image_owner }}/${{ needs.prep.outputs.image_repo }}-${{ matrix.component }}
          tags: |
            type=raw,value=${{ needs.prep.outputs.version }}
            type=sha,prefix=sha-,format=short

      # Same inputs and gha cache scope as the smoke build, so the pushed layers are the smoke-tested ones.
      - name: Publish smoke-tested image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=love-book-${{ matrix.component }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.component }}

  promote-latest:
    name: move convenience latest pointer
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [prep, publish]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable source images
        shell: bash
        run: |
          docker buildx imagetools inspect \
            "${REGISTRY}/${{ needs.prep.outputs.image_owner }}/${{ needs.prep.outputs.image_repo }}-backend:${{ needs.prep.outputs.version }}"
          docker buildx imagetools inspect \
            "${REGISTRY}/${{ needs.prep.outputs.image_owner }}/${{ needs.prep.outputs.image_repo }}-frontend:${{ needs.prep.outputs.version }}"

      - name: Point latest at the smoke-tested pair
        shell: bash
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${{ needs.prep.outputs.image_owner }}/${{ needs.prep.outputs.image_repo }}-backend:latest" \
            "${REGISTRY}/${{ needs.prep.outputs.image_owner }}/${{ needs.prep.outputs.image_repo }}-backend:${{ needs.prep.outputs.version }}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${{ needs.prep.outputs.image_owner }}/${{ needs.prep.outputs.image_repo }}-frontend:latest" \
            "${REGISTRY}/${{ needs.prep.outputs.image_owner }}/${{ needs.prep.outputs.image_repo }}-frontend:${{ needs.prep.outputs.version }}"

  release:
    name: publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [prep, promote-latest]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Render release notes from Changelog
        run: python scripts/version.py notes --tag "$GITHUB_REF_NAME" > release-notes.md

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prep.outputs.version }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Love Book ${VERSION}" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Love Book ${VERSION}" --notes-file release-notes.md
          fi
