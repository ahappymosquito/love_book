name: release-images

# Stable semantic-version tags are the only event allowed to publish images.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  DEFAULT_API_BASE: /api

jobs:
  verify:
    name: release gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Poetry
        run: pipx install poetry==2.2.1

      - name: Match tag to the canonical version
        run: python scripts/version.py check --tag "$GITHUB_REF_NAME"

      - name: Install and test locked backend
        run: |
          poetry sync --no-root --no-interaction
          poetry run python -m pytest -q --basetemp=.pytest-tmp/release

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install and build locked frontend
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

  prep:
    name: image metadata
    runs-on: ubuntu-24.04
    needs: verify
    outputs:
      image_owner: ${{ steps.names.outputs.owner }}
      image_repo: ${{ steps.names.outputs.repo }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read canonical version
        id: version
        shell: bash
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Normalize image names
        id: names
        shell: bash
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          repo="${GITHUB_REPOSITORY##*/}"
          echo "repo=${repo,,}" >> "$GITHUB_OUTPUT"

  backend:
    name: publish · backend
    runs-on: ubuntu-24.04
    needs: prep
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prep.outputs.image_owner }}/${{ needs.prep.outputs.image_repo }}-backend
          tags: |
            type=raw,value=${{ needs.prep.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=love-book-backend
            org.opencontainers.image.description=FastAPI backend for Love Book
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

  frontend:
    name: publish · frontend
    runs-on: ubuntu-24.04
    needs: prep
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute immutable tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ needs.prep.outputs.image_owner }}/${{ needs.prep.outputs.image_repo }}-frontend
          tags: |
            type=raw,value=${{ needs.prep.outputs.version }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=love-book-frontend
            org.opencontainers.image.description=Next.js frontend for Love Book
            org.opencontainers.image.version=${{ needs.prep.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and publish frontend
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NEXT_PUBLIC_API_BASE=${{ env.DEFAULT_API_BASE }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
