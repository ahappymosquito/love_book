# Love Book production compose: backend and frontend on loopback.
# Public 80/443 is host nginx (deploy/nginx). Local development uses start_dev.bat.
# Copy .env.example to .env, then run: docker compose up -d --build
name: love-book

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: love-book/backend:dev
    container_name: love-book-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      MEDIA_ROOT: /app/media
      MEDIA_STORAGE: local
    volumes:
      - love_book_media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    networks:
      - love-book-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 生产环境通过主机 Nginx 同源反代 /api，管理端入口链接运行时读取浏览器 origin。
        NEXT_PUBLIC_API_BASE: /api
    image: love-book/frontend:dev
    container_name: love-book-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    networks:
      - love-book-net
    depends_on:
      - backend
    logging: *default-logging

networks:
  love-book-net:
    name: love-book-net
    driver: bridge

volumes:
  love_book_media:
