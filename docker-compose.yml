# Love Book production compose: backend and frontend on loopback.
# Public 80/443 is host nginx (deploy/nginx). Local development uses start_dev.bat.
# Frontend starts only after the backend image healthcheck passes and has its own healthcheck.
# Production must pin both services to the same immutable X.Y.Z image tag (or digest), never latest.
# Backend defaults to APP_ENV=production, so a placeholder ADMIN_KEY disables the admin API.
# Copy .env.example to .env, then run: docker compose up -d --build
name: love-book

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: love-book/backend:dev
    container_name: love-book-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      APP_ENV: ${APP_ENV:-production}
      MEDIA_ROOT: /app/media
      MEDIA_STORAGE: local
    volumes:
      - love_book_media:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    networks:
      - love-book-net
    extra_hosts:
      # 同机 MySQL 用 host.docker.internal，不要把会过期的公网主机名写进 DATABASE_URL。
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 生产环境通过主机 Nginx 同源反代 /api，管理端入口链接运行时读取浏览器 origin。
        NEXT_PUBLIC_API_BASE: /api
    image: love-book/frontend:dev
    container_name: love-book-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    networks:
      - love-book-net
    depends_on:
      backend:
        # backend 镜像自带 HEALTHCHECK（curl /health），健康后再启动前端。
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging: *default-logging

networks:
  love-book-net:
    name: love-book-net
    driver: bridge

volumes:
  love_book_media:
