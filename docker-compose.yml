# Love Book production compose: backend, frontend, and Caddy.
# Copy .env.example to .env, then run: docker compose up -d --build
# Caddy issues HTTPS for qrqto.club / www.qrqto.club and reverse-proxies /api to FastAPI.
name: love-book

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: love-book/backend:dev
    container_name: love-book-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      MEDIA_ROOT: /app/media
      MEDIA_STORAGE: local
    volumes:
      - love_book_media:/app/media
    expose:
      - "8000"
    networks:
      - love-book-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 生产环境通过 Caddy 同源反代 /api，管理端入口链接运行时读取浏览器 origin。
        NEXT_PUBLIC_API_BASE: /api
    image: love-book/frontend:dev
    container_name: love-book-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - love-book-net
    depends_on:
      - backend
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    container_name: love-book-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - love-book-net
    logging: *default-logging

networks:
  love-book-net:
    name: love-book-net
    driver: bridge

volumes:
  love_book_media:
  caddy_data:
  caddy_config:
