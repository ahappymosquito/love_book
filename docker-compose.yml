                                            # 我们之间的小事 · 统一部署
# - 后端 / 前端 / Caddy 三个容器
# - MySQL 直连 qrqto.club:3306 (由 .env 提供凭据)
# - Caddy 监听 80/443，自动签发 HTTPS，把 /api/ 反代到后端，其它请求转给 Next.js
#
# 用法：cp .env.example .env && 修改 .env && ./deploy.sh up
# 域名：qrqto.club / www.qrqto.club，由 deploy/caddy/Caddyfile 管理
name: love-book

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: love-book/backend:dev
    container_name: love-book-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      MEDIA_ROOT: /app/media
      MEDIA_STORAGE: local
    volumes:
      - love_book_media:/app/media
    expose:
      - "8000"
    networks:
      - love-book-net
    # 外部 MySQL 走公网域名 qrqto.club：保证容器 DNS 能解析到当前宿主
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging: *default-logging

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # 生产环境通过 Caddy 同源反代 /api，管理端入口链接运行时读取浏览器 origin。
        NEXT_PUBLIC_API_BASE: /api
    image: love-book/frontend:dev
    container_name: love-book-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    networks:
      - love-book-net
    depends_on:
      - backend
    logging: *default-logging

  caddy:
    image: caddy:2-alpine
    container_name: love-book-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      - love-book-net
    logging: *default-logging

networks:
  love-book-net:
    name: love-book-net
    driver: bridge

volumes:
  love_book_media:
  caddy_data:
  caddy_config:
